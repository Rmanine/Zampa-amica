<!DOCTYPE html>
<html lang="it">

<head>
    <title>I nostri animali | Zampa Amica</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scopri gli animali di Zampa Amica e inizia ad adottare." />
    <meta name="keywords" content="Zampa Amica, adozione, animali, cane, gatto, filtri" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" media="screen and (max-width:900px)" href="./css/mobile.css" />
    <link rel="stylesheet" media="print" href="./css/print.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet" />
    <link rel="shortcut icon" type="image/png" href="./img/icona_logo.ico" />
    <script async src="js/scripts.js"></script>
    <script src="js/filtri.js" defer></script>
</head>

<body>
    <a class="aiuto" href="#contenuto">Salta al contenuto</a>
    [header]

    <nav id="breadcrumb">
        <p>Ti trovi in: <a lang="en" href="./index.php">Home</a> / I nostri animali</p>
    </nav>

    <main id="contenuto">
        <h1>I nostri animali</h1>
        <p>Seleziona le tue preferenze attraverso i filtri ed esplora i cani e i gatti in cerca di una casa.</p>

        <button id="toggle-filtri" aria-expanded="false" aria-controls="filtri">
            Mostra i filtri
        </button>
        <div id="overlay-filtri" aria-hidden="true"></div>

        <form id="filtri" aria-label="Filtri animali" role="dialog" aria-modal="true">

            <h2>Filtri</h2>
            <details>
                <summary>Tipo</summary>
                <fieldset>
                    <legend>Tipo</legend>
                    <label><input type="radio" name="tipo" value="all" checked /> Tutti</label>
                    <label><input type="radio" name="tipo" value="cane" />Cane</label>
                    <label><input type="radio" name="tipo" value="gatto" />Gatto</label>
                </fieldset>
            </details>

            <details>
                <summary>Sesso</summary>
                <fieldset>
                    <legend>Sesso</legend>
                    <label><input type="radio" name="sesso" value="all" checked /> Tutti</label>
                    <label><input type="radio" name="sesso" value="maschio" />Maschio</label>
                    <label><input type="radio" name="sesso" value="femmina" />Femmina</label>
                </fieldset>
            </details>

            <details>
                <summary>Taglia</summary>
                <fieldset>
                    <legend>Taglia</legend>
                    <label><input type="radio" name="taglia" value="all" checked /> Tutti</label>
                    <label><input type="radio" name="taglia" value="piccola" />Piccola</label>
                    <label><input type="radio" name="taglia" value="media" />Media</label>
                    <label><input type="radio" name="taglia" value="grande" />Grande</label>
                </fieldset>
            </details>

            <details>
                <summary>Et&agrave;</summary>
                <fieldset>
                    <legend>Et&agrave;</legend>
                    <label><input type="radio" name="eta" value="all" checked /> Tutti</label>
                    <label><input type="radio" name="eta" value="0-12" aria-label="Fino a 12 mesi"/>0-12 mesi</label>
                    <label><input type="radio" name="eta" value="1-3" aria-label="Da 1 a 3 anni"/>1-3 anni</label>
                    <label><input type="radio" name="eta" value="4-8" aria-label="Da 4 a 8 anni"/>4-8 anni</label>
                    <label><input type="radio" name="eta" value="8+" />Pi&ugrave; di 8 anni</label>
                </fieldset>
            </details>
            <button type="submit" name="submit-filters">Applica filtri</button>
            <button type="button" id="chiudi-filtri">Chiudi filtri</button>
        </form>
        <h2>Risultati</h2>
        <p>[filtriAttivi]</p>
        [listaAnimali]
    </main>

    [footer]
</body>

</html>
